openapi: 3.2.0
info:
  title: HP Workforce Solutions Analytics API
  description: The HP Workforce Solutions Analytics API provides insightful analytics on planning, cost optimization, and service management capabilities for devices enrolled in HP Proactive Insights.
  version: 1.0.0
  contact:
    name: HP Developer Portal
    url: https://developers.hp.com/
servers:
- url: https://daas.api.hp.com
  description: Production
tags:
- name: Analytics
  description: Device analytics operations
paths:
  /analytics/devices:
    get:
      operationId: getDeviceAnalytics
      summary: Get Device Analytics
      description: Retrieve analytics data for enrolled devices.
      tags:
      - Analytics
      parameters:
      - name: startDate
        in: query
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAnalyticsList'
        '401':
          description: Unauthorized
components:
  schemas:
    DeviceAnalytics:
      type: object
      properties:
        deviceId:
          type: string
        healthScore:
          type: number
        utilizationRate:
          type: number
        lastReportDate:
          type: string
          format: date-time
    DeviceAnalyticsList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DeviceAnalytics'
