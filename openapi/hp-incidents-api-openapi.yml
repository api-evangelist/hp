openapi: 3.1.0
info:
  title: HP PrintOS Device Analytics Incidents API
  description: The HP PrintOS Device API enables device manufacturers and print shop IT developers to attach their devices to the PrintOS Cloud Platform and interact with platform services.
  version: 1.0.0
  contact:
    name: HP Developer Portal
    url: https://developers.hp.com/
servers:
- url: https://printos.api.hp.com
  description: Production
tags:
- name: Incidents
  description: Incident management operations
paths:
  /analytics/incidents:
    get:
      operationId: getIncidents
      summary: Get Incidents
      description: Retrieve incident data for managed devices.
      tags:
      - Incidents
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentList'
components:
  schemas:
    IncidentList:
      type: object
      properties:
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/Incident'
    Incident:
      type: object
      properties:
        id:
          type: string
        deviceId:
          type: string
        severity:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
