openapi: 3.2.0
info:
  title: HP Workforce Solutions Analytics Incidents API
  description: The HP Workforce Solutions Analytics API provides insightful analytics on planning, cost optimization, and service management capabilities for devices enrolled in HP Proactive Insights.
  version: 1.0.0
  contact:
    name: HP Developer Portal
    url: https://developers.hp.com/
servers:
- url: https://daas.api.hp.com
  description: Production
tags:
- name: Incidents
  description: Incident management operations
paths:
  /analytics/incidents:
    get:
      operationId: getIncidents
      summary: Get Incidents
      description: Retrieve incident data for managed devices.
      tags:
      - Incidents
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentList'
components:
  schemas:
    Incident:
      type: object
      properties:
        id:
          type: string
        deviceId:
          type: string
        severity:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
    IncidentList:
      type: object
      properties:
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/Incident'
